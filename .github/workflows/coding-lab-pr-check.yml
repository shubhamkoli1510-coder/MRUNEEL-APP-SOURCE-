name: MRUNEEL Coding Lab PR Safety & Tests

on:
  push:
    branches:
      - feature/coding-lab-review-test-workflow
      - feature/mruneel-decision-engine-phase1
      - feature/mruneel-tools-registry-phase1
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - feature/mruneel-blue-jarvis-new-install
      - feature/native-wakeword-bridge
      - feature/autonomous-coding-lab
      - feature/coding-lab-review-test-workflow

permissions:
  contents: read

jobs:
  branch-build:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (github.head_ref == 'feature/coding-lab-review-test-workflow' || github.head_ref == 'feature/mruneel-decision-engine-phase1' || github.head_ref == 'feature/mruneel-tools-registry-phase1'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type-check
        run: npm run lint
      - name: Decision engine unit tests
        run: npm test
      - name: Production build
        run: npm run build

  coding-lab-checks:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'mruneel-coding/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate Coding Lab change scope and secret patterns
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: node scripts/coding-lab-pr-guard.mjs "$BASE_SHA" "$HEAD_SHA" "$HEAD_BRANCH"
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type-check
        run: npm run lint
      - name: Production build
        run: npm run build
