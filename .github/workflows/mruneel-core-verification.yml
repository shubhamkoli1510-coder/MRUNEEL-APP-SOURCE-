name: MRUNEEL Core Verification

on:
  push:
    branches:
      - feature/mruneel-jarvis-parity-foundation-phase1
      - feature/mruneel-coding-agent-approval-gate-phase1
      - feature/mruneel-coding-agent-consent-architecture-phase1
      - feature/mruneel-coding-lab-review-approval-ui-phase1
      - feature/mruneel-autonomous-coding-loop-phase1
      - feature/mruneel-coding-loop-ui-integration-phase1
      - feature/mruneel-proposal-diff-validator-phase1
      - feature/mruneel-diff-header-integrity-phase1
      - feature/mruneel-diff-orphan-header-guard-phase1
      - feature/mruneel-diff-malformed-hunk-guard-phase1
      - feature/mruneel-canonical-diff-path-guard-phase1
      - feature/mruneel-approval-path-integrity-phase1
      - feature/mruneel-sandbox-stream-timeout-phase1
      - feature/mruneel-sandbox-event-protocol-guard-phase1
      - feature/mruneel-sandbox-create-deadline-phase1
      - feature/mruneel-approval-path-integrity-phase1
      - feature/mruneel-sandbox-stream-timeout-phase1
      - feature/mruneel-sandbox-event-protocol-guard-phase1
      - feature/mruneel-sandbox-create-deadline-phase1
      - feature/mruneel-sandbox-job-policy-phase1
      - feature/mruneel-render-sandbox-adapter-phase1
  pull_request:
    branches:
      - feature/mruneel-safe-launchers-phase1
      - feature/mruneel-jarvis-parity-foundation-phase1
      - feature/mruneel-coding-agent-approval-gate-phase1
      - feature/mruneel-coding-agent-consent-architecture-phase1
      - feature/mruneel-coding-lab-review-approval-ui-phase1
      - feature/mruneel-coding-lab-multifile-review-phase1
      - feature/mruneel-autonomous-coding-loop-phase1
      - feature/mruneel-coding-loop-ui-integration-phase1
      - feature/mruneel-proposal-diff-validator-phase1
      - feature/mruneel-diff-orphan-header-guard-phase1
      - feature/mruneel-diff-hunk-boundary-guard-phase1
      - feature/mruneel-canonical-diff-path-guard-phase1
      - feature/mruneel-render-sandbox-sdk-phase1
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Core tests
        run: npm test
      - name: Type check
        run: npm run lint
      - name: Web build
        run: npm run build
