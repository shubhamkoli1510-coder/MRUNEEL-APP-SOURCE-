name: MRUNEEL Core Verification

on:
  push:
    branches:
      - feature/mruneel-jarvis-parity-foundation-phase1
      - feature/mruneel-coding-agent-approval-gate-phase1
      - feature/mruneel-coding-agent-consent-architecture-phase1
  pull_request:
    branches:
      - feature/mruneel-safe-launchers-phase1
      - feature/mruneel-jarvis-parity-foundation-phase1
      - feature/mruneel-coding-agent-approval-gate-phase1
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Core tests
        run: npm test
      - name: Type check
        run: npm run lint
      - name: Web build
        run: npm run build
