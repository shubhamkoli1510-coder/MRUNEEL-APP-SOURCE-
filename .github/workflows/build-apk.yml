name: Build Android APK (MRUNEEL)

on:
  push:
    branches: [ main, master, feature/cloud-ai-fallback, feature/mruneel-blue-jarvis-new-install ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Android signing key
        env:
          MRUNEEL_KEYSTORE_BASE64: ${{ secrets.MRUNEEL_KEYSTORE_BASE64 }}
          MRUNEEL_KEYSTORE_PASSWORD: ${{ secrets.MRUNEEL_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MRUNEEL_KEYSTORE_BASE64" || { echo "ERROR: MRUNEEL_KEYSTORE_BASE64 secret is empty or missing"; exit 1; }
          test -n "$MRUNEEL_KEYSTORE_PASSWORD" || { echo "ERROR: MRUNEEL_KEYSTORE_PASSWORD secret is empty or missing"; exit 1; }
          mkdir -p android/app/build
          printf '%s' "$MRUNEEL_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > android/app/build/mruneel-upload.p12
          test -s android/app/build/mruneel-upload.p12 || { echo "ERROR: Keystore file is empty"; exit 1; }
          chmod 600 android/app/build/mruneel-upload.p12
          openssl pkcs12 -in android/app/build/mruneel-upload.p12 -passin env:MRUNEEL_KEYSTORE_PASSWORD -info -noout >/dev/null 2>&1 || { echo "ERROR: Decoded keystore is invalid or password does not match. Recheck GitHub signing secrets."; exit 1; }
          echo "SUCCESS: Android signing keystore decoded and validated."

      - name: Build Signed Release APK
        working-directory: android
        env:
          MRUNEEL_KEYSTORE_PASSWORD: ${{ secrets.MRUNEEL_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --info 2>&1 | tee gradle-build.log

      - name: Upload Gradle Diagnostic Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MRUNEEL-Gradle-Diagnostic
          path: android/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload MRUNEEL Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MRUNEEL-Blue-JARVIS-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
