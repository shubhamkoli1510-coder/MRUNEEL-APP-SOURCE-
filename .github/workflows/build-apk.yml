name: Build Android APK (MRUNEEL)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log

      - name: Upload Gradle Diagnostic Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MRUNEEL-Gradle-Diagnostic
          path: android/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload MRUNEEL APK
        uses: actions/upload-artifact@v4
        with:
          name: MRUNEEL-Assistant-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
